name: agroplan
description: AI-powered crop planning assistant for regenerative agriculture.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management + dependency injection (like Hilt + ViewModel)
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation (like Android Navigation Component)
  go_router: ^17.2.3

  # Immutable models with copyWith + pattern matching (like Kotlin data class)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Backend: auth, database, realtime, storage
  supabase_flutter: ^2.5.6

  # Local SQLite offline cache (like Room)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0

  # Lightweight key-value store for flags (onboarding seen, theme pref)
  shared_preferences: ^2.3.1

  # Images from CDN
  cached_network_image: ^3.3.1

  # SVG icons
  flutter_svg: ^2.0.10+1

  # Fonts: Instrument Serif (headings) + JetBrains Mono (labels)
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.11
  freezed: ^3.2.5             # Generates copyWith, ==, toString, pattern match
  json_serializable: ^6.8.0   # Generates fromJson / toJson
  riverpod_generator: ^4.0.3  # Generates @riverpod provider boilerplate
  drift_dev: ^2.18.0          # Generates DB table classes + query extensions

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Note: InstrumentSerif and JetBrains Mono are loaded via google_fonts package at runtime.
  # No local font asset files needed.
